name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci

      # First, because it is the one failure that cannot be undone: this
      # repository is public, and a leak stays public after the revert.
      - name: Public-boundary check
        run: npm run check:boundary

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
